<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>講座案内 | Color Co-ology Laboratory</title>
    <meta name="description" content="色彩心理を専門的に学ぶための講座案内。プロを目指すアドバイザー養成講座から、手軽に学べるオンライン講座まで。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        'coco-primary': '#027f24',
                        'coco-accent': '#e37a93',
                        'coco-text': '#333333',
                    }
                }
            }
        }
    </script>
    <style>
        .color-blur-bg {
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 80% 0%, hsla(180, 50%, 90%, 0.5) 0, transparent 50%), 
                radial-gradient(at 0% 50%, hsla(280, 50%, 90%, 0.5) 0, transparent 50%), 
                radial-gradient(at 80% 100%, hsla(339, 50%, 90%, 0.5) 0, transparent 50%),
                radial-gradient(at 0% 0%, hsla(200, 50%, 95%, 0.5) 0, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>

                        <span class="text-xl font-bold text-slate-800 tracking-wider hidden sm:block">

                        </span>

                <nav class="hidden md:flex space-x-8 items-center">
                    <a href="index.html" class="text-slate-600 hover:text-indigo-500 px-3 py-2 rounded-md text-sm font-medium transition-colors">ホーム</a>
                    <a href="profile.html" class="text-slate-600 hover:text-indigo-500 px-3 py-2 rounded-md text-sm font-medium transition-colors">プロフィール</a>

                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden flex flex-col md:flex-row hover:shadow-xl transition-shadow duration-300">
                    <div class="md:w-2/5 relative min-h-[300px]">

                            <div class="flex items-center text-sm text-slate-500">
                                <svg class="w-5 h-5 text-green-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>

                        <div>
